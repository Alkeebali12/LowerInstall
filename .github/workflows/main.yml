name: Build LowerInstall

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl sudo build-essential fakeroot rsync git perl libxml2 libtinfo6 xz-utils unzip

      - name: Install Theos
        env:
          CI: true
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Verify Theos
        run: |
          test -x $HOME/theos/toolchain/linux/iphone/bin/clang
          ls -la $HOME/theos/sdks
          $HOME/theos/toolchain/linux/iphone/bin/clang --version

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: LowerInstall-DEB
          path: packages/*.deb
