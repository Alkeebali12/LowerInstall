name: Build LowerInstall

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot git curl perl unzip xz-utils

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Install iOS Toolchain
        run: |
          mkdir -p $HOME/theos/toolchain/linux
          curl -L https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain.tar.xz -o /tmp/iOSToolchain.tar.xz
          tar -xJf /tmp/iOSToolchain.tar.xz -C $HOME/theos/toolchain/linux
          test -x $HOME/theos/toolchain/linux/iphone/bin/clang

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LowerInstall-DEB
          path: packages/*.deb
